<!doctype html><html lang="en"><meta charset="utf-8"><title>Five-family installation review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e3e8eb;color:#17262f;font:14px Arial,sans-serif;letter-spacing:0}header{padding:12px 20px;background:white;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}select{padding:8px;border:1px solid #8195a1;border-radius:4px}canvas{display:block;width:100%;height:660px}footer{padding:12px 20px;background:white;line-height:1.5}</style>
<header><h1>Five-family installation estimates</h1><label>Equipment <select id="family"><option value="iem">IEM</option><option value="power-units">PSUs</option><option value="frontier-radio">Frontier radio</option><option value="nose-electronics">Navigation</option><option value="battery">Battery</option></select></label><output id="revision"></output></header>
<canvas aria-label="Actual equipment installation review"></canvas>
<footer>Raw model materials and installed poses. Existing cable curves and hardware are retained. Clamps and retention are estimates; navigation ports remain capped. Not a complete flight harness.</footer>
<script type="module">
import * as T from '../../dist/vendor/three/three.module.min.js?v=dev';
const names={iem:'buildIem','power-units':'buildPowerUnits','frontier-radio':'buildFrontierRadio','nose-electronics':'buildNoseElectronics',battery:'buildBattery'};
const query=new URLSearchParams(location.search),family=names[query.get('family')]?query.get('family'):'iem',before=query.has('before'),draft=query.has('draft'),detail=query.has('detail');
document.querySelector('#family').value=family;
document.querySelector('select').onchange=e=>{query.set('family',e.target.value);location.search=query.toString();};
let module;
if(before||draft){
 const file=draft?(family==='iem'?'draft-iem-support.mjs':'draft-psu-support.mjs'):family+'.mjs';
 let code=await(await fetch('../../archive/avionics-installation-2026-10-25/'+file)).text();
 code=code.replace('./vendor/three/three.module.min.js?v=dev',new URL('../../dist/vendor/three/three.module.min.js?v=dev',location.href).href);
 code=code.replace('./cable-installation.mjs?v=dev',new URL('../../dist/cable-installation.mjs?v=dev',location.href).href);
 const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));module=await import(url);URL.revokeObjectURL(url);
}else module=await import('../../dist/'+family+'.mjs');
const scene=new T.Scene();scene.background=new T.Color(0xe3e8eb);scene.add(new T.HemisphereLight(0xffffff,0x596a72,2.6));
const light=new T.DirectionalLight(0xffffff,3.4);light.position.set(3,4,-3);scene.add(light);
const root=new T.Group();scene.add(root);
const mesh=(g,m,p,parent)=>{const o=new T.Mesh(g,m);o.position.fromArray(p);parent.add(o);return o;};
module[names[family]]({parent:root,mesh});
document.querySelector('output').textContent=(before?'Before':draft?'Rejected draft':'Current')+(detail?' | Detail':'')+' | '+root.userData.assetRevision;
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);
const camera=new T.OrthographicCamera(-1,1,1,-1,.001,20);
function draw(){
 root.updateMatrixWorld(true);let box=new T.Box3().setFromObject(root);
 if(detail){
  const key={iem:'install-iem-5-','power-units':'install-psu-1-','frontier-radio':'install-radio-rf-1-','nose-electronics':'install-imu-a-','battery':'install-battery-1-'}[family],close=new T.Box3();
  if(family==='nose-electronics')close.setFromObject(root.getObjectByName('install-imu-a-retention-head'));
  else root.traverse(o=>{if(o.isMesh&&o.name.startsWith(key)&&!o.name.endsWith('-lacing'))close.union(new T.Box3().setFromObject(o));});
  if(!close.isEmpty())box=close;
 }
 const center=box.getCenter(new T.Vector3());
 const width=document.querySelector('canvas').clientWidth,height=660,aspect=width/height;
 renderer.setSize(width,height,false);
 const directions={iem:[1.3,.5,.65],'power-units':[1.8,1.4,1.5],'frontier-radio':[-1.4,1.8,.8],'nose-electronics':[-1,1.4,1.4],battery:[-.8,.5,-1.5]};
 if(detail&&family==='nose-electronics')directions[family]=[1,1.4,1.4];
 camera.position.copy(center).add(new T.Vector3(...directions[family]));camera.lookAt(center);camera.updateMatrixWorld(true);
 let half=.01;for(const x of[box.min.x,box.max.x])for(const y of[box.min.y,box.max.y])for(const z of[box.min.z,box.max.z]){
  const p=new T.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse);half=Math.max(half,Math.abs(p.y),Math.abs(p.x)/aspect);
 }
 half*=1.12;camera.left=-half*aspect;camera.right=half*aspect;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();renderer.render(scene,camera);
 const gl=renderer.getContext(),pixels=new Uint8Array(width*height*4);gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let count=0;
 for(let i=0;i<pixels.length;i+=4)if(Math.max(Math.abs(pixels[i]-227),Math.abs(pixels[i+1]-232),Math.abs(pixels[i+2]-235))>25)count++;
 Object.assign(document.querySelector('canvas').dataset,{family,detail:String(detail),version:before?'before':draft?'draft':'current',nonblank:String(count>1000),pixelCount:String(count)});
}
window.addEventListener('resize',draw);draw();
</script></html>
