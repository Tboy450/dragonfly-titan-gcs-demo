<!doctype html><html lang="en"><meta charset="utf-8"><title>Attic connection review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e3e8eb;color:#17262f;font:14px Arial,sans-serif;letter-spacing:0}header{padding:14px 20px;background:white;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}button{padding:8px 12px;border:1px solid #8195a1;background:white;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#1d586c;color:white}canvas{display:block;width:100%;height:680px}footer{padding:12px 20px;background:white;line-height:1.5}</style>
<header><h1>Attic connections: installation estimates</h1><button id="overview" aria-pressed="true">Installed attic</button><button id="wire" aria-pressed="false">Short wire detail</button><button id="carousel" aria-pressed="false">Carousel line</button><output id="revision"></output></header>
<canvas id="sample" aria-label="Actual attic model connection review"></canvas>
<footer>Whole view retains actual materials. Detail views ghost nearby casings for inspection. No flight circuit or line function is established by appearance.</footer>
<script type="module">
import * as T from '../../dist/vendor/three/three.module.min.js?v=dev';
import {buildWonderwall} from '../../dist/wonderwall.mjs';
const params=new URLSearchParams(location.search);
async function load(file){
 if(!params.has('before')&&!params.has('draft'))return import('../../dist/'+file);
 const archive=params.has('draft')&&file==='drams-assembly.mjs'?'rejected-width-draft.mjs':file;
 let source=await(await fetch('../../archive/attic-connection-media-2026-10-23/'+archive)).text();
 for(const relative of ['./vendor/three/three.module.min.js?v=dev','./wonderwall.mjs?v=dev'])source=source.replace(relative,new URL('../../dist/'+relative.slice(2),location.href).href);
 const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));const module=await import(url);URL.revokeObjectURL(url);return module;
}
const dramsModule=await load('drams-assembly.mjs'),carouselModule=await load('sample-carousel.mjs');
document.querySelector('#revision').textContent=params.has('before')?'Before: drams-2026-10-20':params.has('draft')?'Rejected width draft':dramsModule.dramsAsset.revision;
const scene=new T.Scene();scene.background=new T.Color(0xe3e8eb);scene.add(new T.HemisphereLight(0xffffff,0x596a72,2.4));
const sun=new T.DirectionalLight(0xffffff,3.2);sun.position.set(3,5,3);scene.add(sun);
const mesh=(g,m,p,parent)=>{const o=new T.Mesh(g,m);o.position.fromArray(p);parent.add(o);return o;};
const root=new T.Group();scene.add(root);
const drams=new T.Group(),carousel=new T.Group(),wall=new T.Group();root.add(drams,carousel,wall);
dramsModule.buildDramsAssembly({parent:drams,mesh});carouselModule.buildSampleCarousel({parent:carousel,mesh});buildWonderwall({parent:wall,mesh});root.updateMatrixWorld(true);
const materials=new Map();root.traverse(o=>{if(o.isMesh)materials.set(o,o.material);});
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);
const camera=new T.OrthographicCamera(-1,1,1,-1,.001,20);let view='overview';
function draw(){
 for(const[o,m]of materials){if(o.material!==m)o.material.dispose();o.material=m;}
 drams.visible=view!=='carousel';carousel.visible=view!=='wire';wall.visible=view==='overview';
 let target=root;
 if(view!=='overview'){
  target=view==='wire'?drams.getObjectByName('drams-wire-bundle'):carousel;
  (view==='wire'?drams:carousel).traverse(o=>{if(o.isMesh&&o!==target&&!/wire-(lacing|support)|carousel-white-wire/.test(o.name)){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=.20;o.material.depthWrite=false;}});
 }
 root.updateMatrixWorld(true);const box=new T.Box3().setFromObject(target),center=box.getCenter(new T.Vector3());
 const width=document.querySelector('canvas').clientWidth,height=680,aspect=width/height;
 renderer.setSize(width,height,false);camera.position.copy(center).add(new T.Vector3(2.8,1.6,1.4));camera.lookAt(center);camera.updateMatrixWorld(true);
 let half=view==='wire'?.055:.01;
 for(const x of[box.min.x,box.max.x])for(const y of[box.min.y,box.max.y])for(const z of[box.min.z,box.max.z]){const p=new T.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse);half=Math.max(half,Math.abs(p.y),Math.abs(p.x)/aspect);}
 half*=1.14;camera.left=-half*aspect;camera.right=half*aspect;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();renderer.render(scene,camera);
 const gl=renderer.getContext(),pixels=new Uint8Array(width*height*4);gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let count=0;
 for(let i=0;i<pixels.length;i+=4)if(Math.max(Math.abs(pixels[i]-227),Math.abs(pixels[i+1]-232),Math.abs(pixels[i+2]-235))>25)count++;
 document.querySelector('canvas').dataset.nonblank=String(count>1000);document.querySelector('canvas').dataset.pixelCount=String(count);document.querySelector('canvas').dataset.view=view;
}
for(const b of document.querySelectorAll('button'))b.onclick=()=>{view=b.id;for(const button of document.querySelectorAll('button'))button.setAttribute('aria-pressed',String(button===b));draw();};window.addEventListener('resize',draw);draw();
</script></html>
