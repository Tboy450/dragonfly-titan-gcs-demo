<!doctype html><html lang="en"><meta charset="utf-8"><title>18 · Warm duct passages</title>
<style>body{margin:0;background:#e3e8eb;font:17px system-ui;color:#17323d}header,footer{padding:14px 22px}canvas{display:block;width:100%;height:550px}footer{font-size:14px}</style>
<header>18 · Main warm duct / nose outlet — <span id="version"></span></header><canvas></canvas>
<footer>Actual app geometry. Source-supported gas path; section, wall, outlet frame and installation dimensions estimated. Cold bypass and aft bulkhead remain unfinished.</footer>
<script type="module">
import * as T from '../../dist/vendor/three/three.module.min.js?v=dev';
const params=new URLSearchParams(location.search),before=params.has('before'),view=params.get('view')??'nose';
const {buildWarmDuct}=await import(before?'/before/dist/thermal-loop.mjs':'../../dist/thermal-loop.mjs?v=dev');
document.querySelector('#version').textContent=before?'archived solid illustration':'open inspection shells';
const scene=new T.Scene();scene.background=new T.Color('#e3e8eb');scene.add(new T.HemisphereLight(0xffffff,0x62717b,2.5));
const light=new T.DirectionalLight(0xffffff,3);light.position.set(-2,4,-2);scene.add(light);
const root=new T.Group();scene.add(root);const mesh=(g,m,p,parent)=>{const o=new T.Mesh(g,m);o.position.fromArray(p);parent.add(o);return o;};
buildWarmDuct({parent:root,mesh});
if(view!=='whole')root.traverse(o=>{if(o.isMesh&&o.name==='warm-duct-fan-transition')o.visible=false;});
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true}),camera=new T.OrthographicCamera();
const configs={nose:{center:[0,-.25,-1.235],offset:[.22,.23,-.28],half:.16},bore:{center:[0,-.305,-.95],offset:[0,-.01,-.65],half:.095},whole:{center:[0,-.26,-.17],offset:[1.4,.9,-.5],half:1.18}};
function draw(){const {center,offset,half}=configs[view]??configs.nose,w=canvas.clientWidth,h=550,a=w/h;renderer.setSize(w,h,false);
 camera.left=-half*a;camera.right=half*a;camera.top=half;camera.bottom=-half;camera.near=.001;camera.far=10;
 camera.position.fromArray(center).add(new T.Vector3(...offset));camera.lookAt(new T.Vector3(...center));camera.updateProjectionMatrix();renderer.render(scene,camera);
 canvas.dataset.ready='true';
}window.addEventListener('resize',draw);draw();
</script></html>
