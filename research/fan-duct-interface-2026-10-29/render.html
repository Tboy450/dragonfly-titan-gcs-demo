<!doctype html><html lang="en"><meta charset="utf-8"><title>Part18 fan transition</title>
<style>body{margin:0;background:#e3e8eb;font:18px system-ui;color:#17323d}header,footer{padding:16px 24px}canvas{display:block;width:100%;height:620px}footer{font-size:14px}</style>
<header>18 · Fan-side duct transition — <span id="version"></span></header><canvas aria-label="Actual fan-to-duct transition geometry"></canvas><footer>Fans, main duct and aft collar hidden to inspect the transition. Estimated shell/seat, not a flight drawing or complete fluid path.</footer>
<script type="module">
import * as T from '../../dist/vendor/three/three.module.min.js?v=dev';
const before=new URLSearchParams(location.search).has('before');
const {buildFans,buildWarmDuct}=await import(before?'/before/dist/thermal-loop.mjs':'../../dist/thermal-loop.mjs?v=dev');
document.querySelector('#version').textContent=before?'archived solid transition / gap':'open shell seated at fan flanges';
const scene=new T.Scene();scene.background=new T.Color('#e3e8eb');scene.add(new T.HemisphereLight(0xffffff,0x66717b,2.5));const light=new T.DirectionalLight(0xffffff,3);light.position.set(-1,3,-2);scene.add(light);
const root=new T.Group();scene.add(root);const mesh=(g,m,p,parent)=>{const o=new T.Mesh(g,m);o.position.fromArray(p);parent.add(o);return o;};
const fans=buildFans({parent:root,mesh});fans.group.visible=false;
const duct=buildWarmDuct({parent:root,mesh});duct.group.traverse(o=>{if(o.isMesh&&o.name!=='warm-duct-fan-transition')o.visible=false;});
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true}),camera=new T.OrthographicCamera();
function draw(){const width=canvas.clientWidth,height=620,aspect=width/height,half=.14;renderer.setSize(width,height,false);camera.left=-half*aspect;camera.right=half*aspect;camera.top=half;camera.bottom=-half;camera.near=.001;camera.far=10;
 const center=new T.Vector3(0,-.25125,.966);camera.position.copy(center).add(new T.Vector3(.05,.34,.20));camera.lookAt(center);camera.updateProjectionMatrix();renderer.render(scene,camera);
 const gl=renderer.getContext(),pixels=new Uint8Array(width*height*4);gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let count=0;
 for(let i=0;i<pixels.length;i+=4)if(Math.max(Math.abs(pixels[i]-227),Math.abs(pixels[i+1]-232),Math.abs(pixels[i+2]-235))>30)count++;
 canvas.dataset.nonblank=String(count>2000);
}window.addEventListener('resize',draw);draw();
</script></html>
