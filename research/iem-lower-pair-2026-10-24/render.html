<!doctype html><html lang="en"><meta charset="utf-8"><title>IEM service installation review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e3e8eb;color:#17262f;font:14px Arial,sans-serif;letter-spacing:0}header{padding:12px 20px;background:white;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}button{padding:8px 12px;border:1px solid #8195a1;background:white;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#1d586c;color:white}canvas{display:block;width:100%;height:660px}footer{padding:12px 20px;background:white;line-height:1.5}</style>
<header><h1>IEM lower pair: installation estimate</h1><button id="whole" aria-pressed="true">Whole IEM</button><button id="pair" aria-pressed="false">Lower pair</button><output id="revision"></output></header>
<canvas aria-label="Actual IEM model review"></canvas>
<footer>Raw model materials. This pass refines only the two lower leads in the first card column. The completed upper pair, case, plug poses and all 26 endpoints are retained. Installation is estimated, not identified flight wiring.</footer>
<script type="module">
import * as T from '../../dist/vendor/three/three.module.min.js?v=dev';
const query=new URLSearchParams(location.search),version=query.has('before')?'before':query.has('draft')?'draft':'current';
let module;
if(version!=='current'){
 let source=await(await fetch('../../archive/iem-lower-pair-2026-10-24/'+(version==='before'?'iem.mjs':'draft-low-support.mjs'))).text();
 source=source.replace('./vendor/three/three.module.min.js?v=dev',new URL('../../dist/vendor/three/three.module.min.js?v=dev',location.href).href);
 const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));module=await import(url);URL.revokeObjectURL(url);
}else module=await import('../../dist/iem.mjs');
document.querySelector('#revision').textContent=version+': '+module.iemAsset.revision;
const scene=new T.Scene();scene.background=new T.Color(0xe3e8eb);scene.add(new T.HemisphereLight(0xffffff,0x596a72,2.6));
const light=new T.DirectionalLight(0xffffff,3.4);light.position.set(3,4,-3);scene.add(light);
const root=new T.Group();scene.add(root);
const mesh=(g,m,p,parent)=>{const o=new T.Mesh(g,m);o.position.fromArray(p);parent.add(o);return o;};
const {assembly}=module.buildIem({parent:root,mesh});assembly.position.set(0,0,0);assembly.rotation.set(0,0,0);
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);
const camera=new T.OrthographicCamera(-1,1,1,-1,.001,20);let view='whole';
function draw(){
 root.updateMatrixWorld(true);
 const box=view==='whole'?new T.Box3().setFromObject(assembly):new T.Box3(new T.Vector3(-.19,-.005,-.20),new T.Vector3(.15,.12,-.10));
 const center=box.getCenter(new T.Vector3()),width=document.querySelector('canvas').clientWidth,height=660,aspect=width/height;
 renderer.setSize(width,height,false);camera.position.copy(center).add(new T.Vector3(.65,.32,-1.3));camera.lookAt(center);camera.updateMatrixWorld(true);
 let half=.01;for(const x of[box.min.x,box.max.x])for(const y of[box.min.y,box.max.y])for(const z of[box.min.z,box.max.z]){const p=new T.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse);half=Math.max(half,Math.abs(p.y),Math.abs(p.x)/aspect);}
 half*=1.12;camera.left=-half*aspect;camera.right=half*aspect;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();renderer.render(scene,camera);
 const gl=renderer.getContext(),pixels=new Uint8Array(width*height*4);gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let count=0;
 for(let i=0;i<pixels.length;i+=4)if(Math.max(Math.abs(pixels[i]-227),Math.abs(pixels[i+1]-232),Math.abs(pixels[i+2]-235))>25)count++;
 Object.assign(document.querySelector('canvas').dataset,{nonblank:String(count>1000),pixelCount:String(count),view,version});
}
for(const button of document.querySelectorAll('button'))button.onclick=()=>{view=button.id;for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b===button));draw();};
window.addEventListener('resize',draw);draw();
</script></html>
