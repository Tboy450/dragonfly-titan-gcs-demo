name: Publish Dragonfly Simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the simulator
        uses: actions/checkout@v6
      - name: Check simulation and terrain
        run: node --test tests/*.test.mjs
      - name: Stamp build version
        # Source files use ?v=dev and "Build local"; each release gets the commit as its version,
        # so phones fetch fresh files and the header shows which build is live.
        run: |
          short="${GITHUB_SHA::7}"
          stamp="$(TZ=America/New_York date +%Y-%m-%d)"
          grep -rlF '?v=dev' dist --include='*.html' --include='*.js' --include='*.mjs' | xargs sed -i "s/?v=dev/?v=${short}/g"
          sed -i "s|data-build-stamp>Build local<|data-build-stamp>Build ${short} · ${stamp}<|" dist/index.html
          grep -qF "Build ${short}" dist/index.html
          ! grep -rqF '?v=dev' dist --include='*.html' --include='*.js' --include='*.mjs'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
